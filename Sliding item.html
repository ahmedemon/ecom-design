<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATELIER — Studio Showroom</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Swiper JS (Required for draggable continuous scroll) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0a0a0b',
          bone: '#f4f4f2', 
          accent: '#ff4d1c',
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          display: ['"Instrument Serif"', 'Georgia', 'serif'],
        },
      },
    },
  };
</script>

<style>
  html { -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; }

  /* =========================================
     FOREGROUND HAND ANIMATION (The sweeping arm)
     ========================================= */
  @keyframes sweepHand {
    0% { transform: translate3d(100vw, -50%, 0) rotate(5deg); }
    100% { transform: translate3d(-150vw, -50%, 0) rotate(-5deg); }
  }
  
  .foreground-hand {
    position: absolute;
    top: 60%; /* Positioned slightly lower like your image */
    left: 0;
    width: 1200px; /* Massive size for depth of field */
    height: auto;
    z-index: 50;
    pointer-events: none; /* Crucial: allows you to click and drag the products behind it */
    
    /* Smooth infinite animation */
    animation: sweepHand 12s linear infinite;
    will-change: transform; 
  }

  /* =========================================
     STUDIO FLOOR SHADOW
     ========================================= */
  .model-shadow {
    position: relative;
  }
  .model-shadow::after {
    content: '';
    position: absolute;
    bottom: 2%;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 20px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 70%);
    border-radius: 50%;
    z-index: -1;
    transition: all 0.3s ease;
  }

  /* Prevents swiper from cutting off the shadows and hover effects */
  .swiper { overflow: visible !important; }
  
  ::-webkit-scrollbar { display: none; }
</style>
</head>

<body class="bg-bone text-ink font-sans antialiased selection:bg-accent selection:text-white">

<!-- Minimal Header -->
<header class="fixed top-0 w-full z-[60] mix-blend-difference text-white">
  <div class="mx-auto flex h-20 max-w-[1440px] items-center justify-between px-6 md:px-10">
    <a href="#" class="font-display text-2xl tracking-tight text-black">ATELIER<span class="text-accent">.</span></a>
    <nav class="hidden items-center gap-9 text-[12px] font-medium uppercase tracking-[0.16em] md:flex text-black">
      <a href="#" class="hover:text-accent transition">Collection</a>
      <a href="#" class="hover:text-accent transition">Editorial</a>
    </nav>
  </div>
</header>

<main>
  <!-- ================= STUDIO SHOWROOM ================= -->
  <section class="relative flex h-screen min-h-[600px] w-full flex-col justify-end overflow-hidden bg-[#f0efec]">
    
    <!-- Studio Lighting -->
    <div class="absolute inset-0 bg-gradient-to-b from-white/0 to-white/80 pointer-events-none z-0"></div>

    <!-- Centered Editorial Text -->
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 pointer-events-none text-center w-full">
      <h1 class="font-display text-[clamp(3rem,6vw,6rem)] leading-[0.9] text-ink/80">
        New Season<br><span class="italic text-ink/60">Essentials</span>
      </h1>
    </div>

    <!-- Sliding Products (Draggable & Auto-scrolling) -->
    <div class="relative z-10 w-full mb-12">
      <!-- Swiper Container -->
      <div class="swiper heroSwiper w-full">
        <div class="swiper-wrapper items-end pb-16">

          <!-- Slide 1 (Transparent PNG Example) -->
          <div class="swiper-slide !w-[280px] md:!w-[400px]">
            <div class="group relative w-full aspect-square model-shadow cursor-grab active:cursor-grabbing">
              <!-- I am using transparent PNGs here so you don't see boxes -->
              <img src="https://pngimg.com/uploads/running_shoes/running_shoes_PNG5816.png" alt="Shoe" class="h-full w-full object-contain drop-shadow-2xl transition-transform duration-500 group-hover:-translate-y-4" />
            </div>
          </div>

          <!-- Slide 2 -->
          <div class="swiper-slide !w-[280px] md:!w-[400px]">
            <div class="group relative w-full aspect-square model-shadow cursor-grab active:cursor-grabbing">
              <img src="https://pngimg.com/uploads/running_shoes/running_shoes_PNG5823.png" alt="Shoe" class="h-full w-full object-contain drop-shadow-2xl transition-transform duration-500 group-hover:-translate-y-4" />
            </div>
          </div>

          <!-- Slide 3 -->
          <div class="swiper-slide !w-[280px] md:!w-[400px]">
            <div class="group relative w-full aspect-square model-shadow cursor-grab active:cursor-grabbing">
              <img src="https://pngimg.com/uploads/running_shoes/running_shoes_PNG5820.png" alt="Shoe" class="h-full w-full object-contain drop-shadow-2xl transition-transform duration-500 group-hover:-translate-y-4" />
            </div>
          </div>

          <!-- Slide 4 -->
          <div class="swiper-slide !w-[280px] md:!w-[400px]">
            <div class="group relative w-full aspect-square model-shadow cursor-grab active:cursor-grabbing">
              <img src="https://pngimg.com/uploads/running_shoes/running_shoes_PNG5815.png" alt="Shoe" class="h-full w-full object-contain drop-shadow-2xl transition-transform duration-500 group-hover:-translate-y-4" />
            </div>
          </div>

          <!-- Slide 5 -->
          <div class="swiper-slide !w-[280px] md:!w-[400px]">
            <div class="group relative w-full aspect-square model-shadow cursor-grab active:cursor-grabbing">
              <img src="https://pngimg.com/uploads/running_shoes/running_shoes_PNG5821.png" alt="Shoe" class="h-full w-full object-contain drop-shadow-2xl transition-transform duration-500 group-hover:-translate-y-4" />
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- ================= THE GIANT BLURRY FOREGROUND HAND ================= -->
    <!-- This is a real transparent PNG of an arm. It sweeps smoothly from right to left. -->
    <img 
      src="https://pngimg.com/uploads/hand/hand_PNG1954.png" 
      alt="Foreground Arm" 
      class="foreground-hand object-contain"
      style="filter: blur(8px);"
    />

  </section>
</main>

<script>
/* 
  Initialize Swiper 
  - freeMode allows smooth continuous dragging
  - autoplay with delay: 0 and speed: 5000 creates an infinite seamless scroll
  - disableOnInteraction: false means it keeps scrolling after you let go
*/
const heroSwiper = new Swiper('.heroSwiper', {
  slidesPerView: 'auto',
  spaceBetween: 60,
  loop: true,
  speed: 5000, // Very slow, smooth motion
  freeMode: {
    enabled: true,
    sticky: false,
    momentum: false, // Prevents stuttering when you let go
  },
  autoplay: {
    delay: 0, // 0 delay means it never pauses between slides
    disableOnInteraction: false,
  },
  grabCursor: true,
  breakpoints: {
    768: { spaceBetween: 100 }
  }
});
</script>
</body>
</html>
