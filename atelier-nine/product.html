<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Product — Atelier Nine</title>
<meta name="description" content="Atelier Nine makes considered footwear, knitwear and everyday clothing in small runs, from materials that age well." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="font-sans text-gray-900 antialiased" data-page="product">
<div id="site-header"></div>
<main id="top" class="">

<div id="pdp" class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8"></div>
<section id="related-wrap" class="mx-auto max-w-7xl px-4 pb-4 sm:px-6 lg:px-8"><h2 class="font-display text-xl font-extrabold tracking-tight sm:text-2xl">You may also like</h2><div id="related" class="mt-5 grid grid-cols-2 gap-3 sm:gap-5 lg:grid-cols-4"></div></section>

</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>

const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get('id');
const p = Store.find(id);
if (!p) {
  $('pdp').innerHTML = `<div class="py-20 text-center"><h1 class="font-display text-2xl font-extrabold">Product not found</h1><p class="mt-2 text-gray-500">That product doesn't exist or has been retired.</p><a href="shop.html" class="mt-6 inline-block rounded-xl bg-brand-700 px-5 py-3 text-sm font-semibold text-white">Browse the collection</a></div>`;
  $('related-wrap').hidden = true;
} else {
  document.title = p.name + ' — Atelier Nine';
  const first = p.variants.find(v => v.stock > 0) || p.variants[0];
  let sel = { ...first.options }, qty = 1, g = 0;
  const av = () => p.variants.find(v => p.options.every(o => v.options[o.name] === sel[o.name])) || null;
  const optOk = (n, val) => p.variants.some(v => v.options[n] === val && v.stock > 0 && p.options.every(o => o.name === n || v.options[o.name] === sel[o.name]));
  const render = () => {
    const v = av(), ok = v && v.stock > 0, on = Store.wish.has(p.id);
    const maxQ = v ? Math.max(1, v.stock) : 1; qty = Math.min(qty, maxQ);
    $('pdp').innerHTML = `
    <nav class="text-[12px] text-gray-500" aria-label="Breadcrumb"><a class="hover:text-gray-900" href="index.html">Home</a> <span class="mx-1 text-gray-300">/</span> <a class="hover:text-gray-900" href="shop.html?category=${p.category}">${Store.esc(p.categoryLabel)}</a> <span class="mx-1 text-gray-300">/</span> <span class="text-gray-800">${Store.esc(p.name)}</span></nav>
    <div class="mt-5 grid gap-8 lg:grid-cols-2 lg:gap-12">
      <div><div class="relative aspect-square overflow-hidden rounded-2xl bg-gray-50"><img src="${p.images[g]}" alt="${Store.esc(p.name)} — view ${g + 1}" class="h-full w-full object-cover" onerror="this.style.opacity=0"/>${p.badge ? `<span class="absolute left-3 top-3 rounded-full bg-white/95 px-3 py-1 text-[10px] font-bold uppercase tracking-wider shadow-sm">${p.badge}</span>` : ''}</div>
        <div class="mt-3 flex gap-2.5">${p.images.map((im, i) => `<button data-g="${i}" aria-label="View image ${i + 1}" class="h-[68px] w-[68px] overflow-hidden rounded-xl border-2 bg-gray-50 sm:h-20 sm:w-20 ${g === i ? 'border-brand-600' : 'border-transparent hover:border-gray-300'}"><img src="${im}" alt="" class="h-full w-full object-cover" onerror="this.style.opacity=0"/></button>`).join('')}</div></div>
      <div>
        <p class="text-[11px] font-semibold uppercase tracking-wider text-gray-400">${p.brand} · ${Store.esc(p.categoryLabel)}</p>
        <h1 class="mt-2 font-display text-2xl font-extrabold leading-tight tracking-tight sm:text-3xl">${Store.esc(p.name)}</h1>
        <div class="mt-2.5 flex items-center gap-2 text-[12.5px] text-gray-500"><span class="flex gap-0.5 text-amber-500">${[1, 2, 3, 4, 5].map(n => Store.star(n <= Math.round(p.rating) ? 'currentColor' : 'none')).join('')}</span><span class="font-semibold text-gray-800">${p.rating.toFixed(1)}</span><span class="text-gray-300">·</span><span>${p.reviews} reviews</span></div>
        <div class="mt-4 flex flex-wrap items-center gap-x-3 gap-y-2"><span class="font-display text-3xl font-extrabold tracking-tight">${Store.money(v ? v.price : 0)}</span>${v && v.compareAt ? `<span class="text-base text-gray-400 line-through">${Store.money(v.compareAt)}</span><span class="rounded-full bg-rose-50 px-2.5 py-1 text-[11px] font-bold uppercase text-rose-600">${Math.round((1 - v.price / v.compareAt) * 100)}% off</span>` : ''}</div>
        <p class="mt-2.5 text-[13px] ${ok ? 'font-medium text-brand-700' : 'font-semibold text-rose-600'}">${ok ? `● In stock — ${v.stock} left` : '● Out of stock for this combination'}</p>
        <p class="mt-4 text-[14px] leading-relaxed text-gray-600">${Store.esc(p.blurb)}</p>
        ${p.options.map(o => `<div class="mt-6"><div class="flex items-baseline justify-between"><p class="text-[12px] font-semibold">${o.name}</p><p class="text-[12px] font-medium text-gray-500">${Store.esc(sel[o.name])}</p></div><div class="mt-2 flex flex-wrap gap-2">${o.values.map(val => { const a = optOk(o.name, val), s = sel[o.name] === val; return `<button data-opt="${o.name}" data-val="${Store.esc(val)}" ${a ? '' : 'disabled'} aria-pressed="${s}" class="flex items-center gap-2 rounded-xl border px-${o.kind === 'color' ? 3 : 4} py-2 text-[13px] font-medium transition ${s ? 'border-brand-600 bg-brand-50 text-brand-800 ring-1 ring-brand-600' : 'border-gray-200 bg-white text-gray-700 hover:border-gray-400'} ${a ? '' : 'cursor-not-allowed opacity-40 line-through'}">${o.kind === 'color' ? `<span class="h-4 w-4 rounded-full border border-black/10" style="background:${Store.swatch(val)}"></span>` : ''}${Store.esc(val)}</button>`; }).join('')}</div></div>`).join('')}
        <p class="mt-5 text-[12px] text-gray-400">SKU <span class="font-medium text-gray-600">${v ? v.sku : '—'}</span></p>
        <div class="mt-5 flex flex-wrap items-center gap-2.5">
          <div class="inline-flex items-center rounded-xl border border-gray-200"><button data-q="-1" ${qty <= 1 ? 'disabled' : ''} class="grid h-11 w-10 place-items-center text-gray-600 hover:bg-gray-50 disabled:opacity-30" aria-label="Decrease quantity">−</button><span class="w-9 text-center text-sm font-bold" aria-live="polite">${qty}</span><button data-q="1" ${qty >= maxQ ? 'disabled' : ''} class="grid h-11 w-10 place-items-center text-gray-600 hover:bg-gray-50 disabled:opacity-30" aria-label="Increase quantity">+</button></div>
          <button id="add" ${ok ? '' : 'disabled'} class="min-w-[140px] flex-1 rounded-xl bg-brand-700 py-3.5 text-sm font-semibold text-white hover:bg-brand-800 disabled:cursor-not-allowed disabled:opacity-40">Add to cart</button>
          <button id="buy" ${ok ? '' : 'disabled'} class="rounded-xl border border-gray-300 px-6 py-3.5 text-sm font-semibold text-gray-800 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-40">Buy now</button>
          <button data-wish="${p.id}" aria-pressed="${on}" class="grid h-11 w-11 place-items-center rounded-xl border border-gray-200 text-gray-600 hover:border-rose-300 hover:text-rose-500" aria-label="Save to wishlist">${Store.heart(on)}</button>
        </div>
        <div class="mt-6 grid gap-2.5 rounded-xl bg-gray-50 p-4 text-[12.5px] text-gray-600 sm:grid-cols-2"><p>🚚 Free shipping over $100 · 2–4 working days</p><p>↩︎ 60-day returns · free exchanges</p></div>
        <div class="mt-6 divide-y divide-gray-200 border-y border-gray-200">
          <details open><summary class="flex items-center justify-between py-4 text-[13px] font-semibold">Product details<span class="chev text-gray-400">⌄</span></summary><div class="pb-5"><p class="text-[13.5px] leading-relaxed text-gray-600">${Store.esc(p.description)}</p><ul class="mt-3 space-y-1.5 text-[13px] text-gray-600">${p.details.map(d => `<li class="flex gap-2"><span class="mt-[7px] h-1 w-1 shrink-0 rounded-full bg-brand-500"></span>${Store.esc(d)}</li>`).join('')}</ul></div></details>
          <details><summary class="flex items-center justify-between py-4 text-[13px] font-semibold">Shipping &amp; returns<span class="chev text-gray-400">⌄</span></summary><div class="pb-5 text-[13.5px] leading-relaxed text-gray-600">Dispatched within 24 hours from our Portland studio. Standard shipping is $6.90 and free over $100. Unworn items with tags attached can be returned within 60 days — exchanges are always free. <a class="font-semibold text-brand-700 hover:underline" href="shipping-returns.html">Full policy</a></div></details>
          <details><summary class="flex items-center justify-between py-4 text-[13px] font-semibold">Size &amp; fit<span class="chev text-gray-400">⌄</span></summary><div class="pb-5 text-[13.5px] leading-relaxed text-gray-600">Not sure about your size? See our <a class="font-semibold text-brand-700 hover:underline" href="size-guide.html">size guide</a>. Exchanges are free within 60 days.</div></details>
        </div>
      </div>
    </div>`;
  };
  $('pdp').addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.g) { g = +t.dataset.g; render(); }
    else if (t.dataset.opt) { if (!t.disabled) { sel = { ...sel, [t.dataset.opt]: t.dataset.val }; qty = 1; render(); } }
    else if (t.dataset.q) { qty = Math.max(1, qty + +t.dataset.q); render(); }
    else if (t.id === 'add') { if (Store.cart.add(p.id, av().id, qty)) document.dispatchEvent(new Event('cart:added')); }
    else if (t.id === 'buy') { if (Store.cart.add(p.id, av().id, qty)) location.href = 'checkout.html'; }
  });
  document.addEventListener('store:change', () => { if (document.activeElement && document.activeElement.closest('#pdp')) return; render(); });
  render();
  const rel = PRODUCTS.filter(x => x.id !== p.id && x.category === p.category).concat(PRODUCTS.filter(x => x.id !== p.id && x.category !== p.category && x.tags.some(t => p.tags.includes(t)))).slice(0, 4);
  $('related').innerHTML = rel.map(Store.productCard).join('');
}

</script>
</body>
</html>
