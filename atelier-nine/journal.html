<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Journal — Atelier Nine</title>
<meta name="description" content="Atelier Nine makes considered footwear, knitwear and everyday clothing in small runs, from materials that age well." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="font-sans text-gray-900 antialiased" data-page="journal">
<div id="site-header"></div>
<main id="top" class="">
<section class="bg-sand"><div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 sm:py-16 lg:px-8"><nav class="text-[12px] text-gray-500" aria-label="Breadcrumb"><a class="hover:text-gray-900" href="index.html">Home</a> <span class="mx-1 text-gray-300">/</span> <span class="text-gray-800">Journal</span></nav>
<p class="mt-4 text-[11px] font-semibold uppercase tracking-wider text-brand-700">Journal</p>
<h1 class="mt-2 max-w-3xl font-display text-3xl font-extrabold leading-tight tracking-tight text-gray-900 sm:text-4xl">Notes from the studio</h1>
<p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-gray-600">Care guides, maker visits and style notes.</p></div></section>
<div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8"><div id="feat" class="mb-10"></div><div id="jl" class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3"></div></div>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>

const card = (j, big) => `<a href="journal-post.html?slug=${j.slug}" class="group block ${big ? 'grid gap-6 overflow-hidden rounded-3xl bg-sand lg:grid-cols-2' : ''}"><div class="${big ? 'aspect-[3/2] lg:aspect-auto' : 'aspect-[3/2] rounded-2xl'} overflow-hidden bg-gray-100"><img src="${j.image}" alt="" loading="lazy" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" onerror="this.style.opacity=0"/></div><div class="${big ? 'flex flex-col justify-center p-6 sm:p-10' : ''}"><p class="${big ? '' : 'mt-3 '}text-[11px] font-semibold uppercase tracking-wider text-brand-700">${j.tag} · ${j.read} read · ${j.date}</p><h2 class="mt-1 font-display ${big ? 'text-2xl sm:text-3xl' : 'text-lg'} font-extrabold leading-snug group-hover:text-brand-700">${Store.esc(j.title)}</h2><p class="mt-2 text-sm leading-relaxed text-gray-600">${Store.esc(j.excerpt)}</p></div></a>`;
document.getElementById('feat').innerHTML = card(JOURNAL[0], true);
document.getElementById('jl').innerHTML = JOURNAL.slice(1).map(j => card(j)).join('');

</script>
</body>
</html>
