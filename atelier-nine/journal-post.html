<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Journal — Atelier Nine</title>
<meta name="description" content="Atelier Nine makes considered footwear, knitwear and everyday clothing in small runs, from materials that age well." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="font-sans text-gray-900 antialiased" data-page="journal">
<div id="site-header"></div>
<main id="top" class="">
<article class="mx-auto max-w-3xl px-4 py-12 sm:px-6"><div id="post"></div></article><section class="mx-auto max-w-7xl px-4 pb-4 sm:px-6 lg:px-8"><h2 class="font-display text-xl font-extrabold">Keep reading</h2><div id="more" class="mt-5 grid gap-6 sm:grid-cols-3"></div></section>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>

const slug = new URLSearchParams(location.search).get('slug'), j = JOURNAL.find(x => x.slug === slug), $ = id => document.getElementById(id);
if (!j) { $('post').innerHTML = '<div class="py-16 text-center"><h1 class="font-display text-2xl font-extrabold">Story not found</h1><a href="journal.html" class="mt-6 inline-block rounded-xl bg-brand-700 px-5 py-3 text-sm font-semibold text-white">Back to the journal</a></div>'; $('more').parentElement.hidden = true; }
else {
  document.title = j.title + ' — Atelier Nine';
  $('post').innerHTML = `<a href="journal.html" class="text-sm font-semibold text-brand-700 hover:underline">← Journal</a><p class="mt-6 text-[11px] font-semibold uppercase tracking-wider text-brand-700">${j.tag} · ${j.read} read · ${j.date}</p><h1 class="mt-2 font-display text-3xl font-extrabold leading-tight tracking-tight sm:text-4xl">${Store.esc(j.title)}</h1><div class="mt-8 aspect-[3/2] overflow-hidden rounded-2xl bg-gray-100"><img src="${j.image}" alt="" class="h-full w-full object-cover" onerror="this.style.opacity=0"/></div><div class="prose-an mt-8">${j.body.map(p => `<p>${Store.esc(p)}</p>`).join('')}</div>`;
  $('more').innerHTML = JOURNAL.filter(x => x.slug !== slug).slice(0, 3).map(x => `<a href="journal-post.html?slug=${x.slug}" class="group block"><div class="aspect-[3/2] overflow-hidden rounded-2xl bg-gray-100"><img src="${x.image}" alt="" loading="lazy" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" onerror="this.style.opacity=0"/></div><p class="mt-3 text-[11px] font-semibold uppercase tracking-wider text-brand-700">${x.tag}</p><h3 class="mt-1 font-display text-base font-bold group-hover:text-brand-700">${Store.esc(x.title)}</h3></a>`).join('');
}

</script>
</body>
</html>
