<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Account — Atelier Nine</title>
<meta name="description" content="Atelier Nine makes considered footwear, knitwear and everyday clothing in small runs, from materials that age well." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="font-sans text-gray-900 antialiased" data-page="account">
<div id="site-header"></div>
<main id="top" class="">

<div class="mx-auto max-w-5xl px-4 py-12 sm:px-6">
<div id="auth" hidden class="mx-auto max-w-md"><h1 class="font-display text-3xl font-extrabold tracking-tight">Account</h1><p class="mt-1 text-sm text-gray-500">Demo accounts are saved in your browser only.</p>
 <div class="mt-6 flex rounded-xl bg-gray-100 p-1 text-sm font-semibold" role="tablist"><button data-tab="in" role="tab" class="flex-1 rounded-lg py-2">Sign in</button><button data-tab="up" role="tab" class="flex-1 rounded-lg py-2">Create account</button></div>
 <form id="f-in" class="mt-5 space-y-4"><div><label class="block text-[12px] font-semibold text-gray-700" for="in-email">Email</label><input id="in-email" type="email" required class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/15"/></div><div><label class="block text-[12px] font-semibold text-gray-700" for="in-pass">Password</label><input id="in-pass" type="password" required minlength="6" class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/15"/></div><button class="rounded-xl bg-brand-700 px-6 py-3 text-sm font-semibold text-white transition hover:bg-brand-800 disabled:cursor-not-allowed disabled:opacity-40 w-full">Sign in</button></form>
 <form id="f-up" hidden class="mt-5 space-y-4"><div><label class="block text-[12px] font-semibold text-gray-700" for="up-name">Full name</label><input id="up-name" required class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/15"/></div><div><label class="block text-[12px] font-semibold text-gray-700" for="up-email">Email</label><input id="up-email" type="email" required class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/15"/></div><div><label class="block text-[12px] font-semibold text-gray-700" for="up-pass">Password</label><input id="up-pass" type="password" required minlength="6" class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/15"/></div><button class="rounded-xl bg-brand-700 px-6 py-3 text-sm font-semibold text-white transition hover:bg-brand-800 disabled:cursor-not-allowed disabled:opacity-40 w-full">Create account</button></form>
 <p id="auth-err" class="mt-3 hidden rounded-lg bg-rose-50 px-3 py-2 text-[12.5px] text-rose-700"></p></div>
<div id="dash" hidden><div class="flex flex-wrap items-center justify-between gap-3"><div><p class="text-[11px] font-semibold uppercase tracking-wider text-brand-700">My account</p><h1 id="hello" class="font-display text-3xl font-extrabold tracking-tight"></h1><p id="who" class="text-sm text-gray-500"></p></div><button id="out" class="rounded-xl border border-gray-300 px-5 py-2.5 text-sm font-semibold hover:bg-gray-50">Sign out</button></div>
 <div class="mt-8 grid gap-4 sm:grid-cols-3"><a href="wishlist.html" class="rounded-2xl border border-gray-200 p-5 hover:shadow-card"><p class="text-2xl font-extrabold" id="s-wish">0</p><p class="text-sm text-gray-500">Saved items</p></a><a href="cart.html" class="rounded-2xl border border-gray-200 p-5 hover:shadow-card"><p class="text-2xl font-extrabold" id="s-cart">0</p><p class="text-sm text-gray-500">In basket</p></a><div class="rounded-2xl border border-gray-200 p-5"><p class="text-2xl font-extrabold" id="s-ord">0</p><p class="text-sm text-gray-500">Orders</p></div></div>
 <h2 class="mt-10 font-display text-xl font-extrabold">Order history</h2><div id="orders" class="mt-4 space-y-3"></div></div></div>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>

const $ = id => document.getElementById(id), { money, esc } = Store;
const USERS = () => { try { return JSON.parse(localStorage.getItem('an:users')) || []; } catch { return []; } };
function view() {
  const u = Store.user.get(); $('auth').hidden = !!u; $('dash').hidden = !u; if (!u) return;
  $('hello').textContent = 'Hello, ' + u.name.split(' ')[0]; $('who').textContent = u.email;
  $('s-wish').textContent = Store.state.wishlist.length; $('s-cart').textContent = Store.cart.count();
  const os = Store.orders.all().filter(o => o.email.toLowerCase() === u.email.toLowerCase()); $('s-ord').textContent = os.length;
  $('orders').innerHTML = os.length ? os.map(o => `<div class="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-gray-200 p-4"><div><p class="font-semibold">${o.id}</p><p class="text-[12.5px] text-gray-500">${new Date(o.createdAt).toLocaleDateString()} · ${o.items.length} item${o.items.length > 1 ? 's' : ''} · ${money(o.total)}</p></div><a class="text-sm font-semibold text-brand-700 hover:underline" href="track-order.html?id=${o.id}&email=${encodeURIComponent(o.email)}">Track</a></div>`).join('') : '<p class="rounded-2xl bg-gray-50 p-5 text-sm text-gray-500">No orders yet. <a class="font-semibold text-brand-700" href="shop.html">Start shopping</a></p>';
}
const tab = t => { $('f-in').hidden = t !== 'in'; $('f-up').hidden = t !== 'up'; document.querySelectorAll('[data-tab]').forEach(b => b.className = 'flex-1 rounded-lg py-2 ' + (b.dataset.tab === t ? 'bg-white shadow-sm' : 'text-gray-500')); $('auth-err').classList.add('hidden'); };
const err = m => { $('auth-err').textContent = m; $('auth-err').classList.remove('hidden'); };
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => tab(b.dataset.tab)); tab(new URLSearchParams(location.search).get('tab') === 'up' ? 'up' : 'in');
$('f-up').onsubmit = e => { e.preventDefault(); const em = $('up-email').value.trim().toLowerCase(), us = USERS(); if (us.some(x => x.email === em)) return err('An account with that email already exists.'); us.push({ name: $('up-name').value.trim(), email: em, pass: $('up-pass').value }); localStorage.setItem('an:users', JSON.stringify(us)); Store.user.signIn({ name: $('up-name').value.trim(), email: em }); Store.toast('Account created'); view(); };
$('f-in').onsubmit = e => { e.preventDefault(); const em = $('in-email').value.trim().toLowerCase(), x = USERS().find(u => u.email === em && u.pass === $('in-pass').value); if (!x) return err('Email or password is incorrect.'); Store.user.signIn({ name: x.name, email: x.email }); Store.toast('Welcome back'); view(); };
$('out').onclick = () => { Store.user.signOut(); Store.toast('Signed out'); };
document.addEventListener('store:change', view); view();

</script>
</body>
</html>
