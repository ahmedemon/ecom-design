<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Basket — Atelier Nine</title>
<meta name="description" content="Atelier Nine makes considered footwear, knitwear and everyday clothing in small runs, from materials that age well." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="font-sans text-gray-900 antialiased" data-page="cart">
<div id="site-header"></div>
<main id="top" class="">
<section class="bg-sand"><div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 sm:py-16 lg:px-8"><nav class="text-[12px] text-gray-500" aria-label="Breadcrumb"><a class="hover:text-gray-900" href="index.html">Home</a> <span class="mx-1 text-gray-300">/</span> <span class="text-gray-800">Basket</span></nav>
<p class="mt-4 text-[11px] font-semibold uppercase tracking-wider text-brand-700">Basket</p>
<h1 class="mt-2 max-w-3xl font-display text-3xl font-extrabold leading-tight tracking-tight text-gray-900 sm:text-4xl">Your basket</h1>
</div></section>
<div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8"><div id="cart-root"></div></div>

</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>

const $ = id => document.getElementById(id), { money, esc } = Store;
function render() {
  const lines = Store.cart.lines();
  if (!lines.length) { $('cart-root').innerHTML = `<div class="py-16 text-center"><p class="font-display text-xl font-bold">Your basket is empty</p><p class="mt-1 text-sm text-gray-500">Nothing here yet — start with a bestseller.</p><a href="shop.html?tag=best" class="mt-6 inline-block rounded-xl bg-brand-700 px-6 py-3 text-sm font-semibold text-white hover:bg-brand-800">Shop best sellers</a></div>`; return; }
  const sub = Store.cart.subtotal(), disc = Store.cart.discount(), ship = Store.cart.shipping();
  const left = Math.max(0, Store.FREE_SHIP - (sub - disc));
  $('cart-root').innerHTML = `<div class="grid gap-8 lg:grid-cols-[1fr_380px]">
  <div><div class="mb-4 rounded-xl ${left ? 'bg-gray-50 text-gray-700' : 'bg-brand-50 text-brand-800'} px-4 py-3 text-[13px] font-medium">${left ? `Add ${money(left)} more for free shipping` : '🎉 You have free shipping'}</div>
  <ul class="divide-y divide-gray-100 rounded-2xl border border-gray-200 bg-white px-5">${lines.map(l => `<li class="flex gap-4 py-5"><a href="product.html?id=${l.product.id}" class="h-24 w-24 shrink-0 overflow-hidden rounded-xl bg-gray-50"><img src="${l.product.images[0]}" alt="${esc(l.product.name)}" class="h-full w-full object-cover" onerror="this.style.opacity=0"/></a>
    <div class="min-w-0 flex-1"><div class="flex justify-between gap-3"><div><a href="product.html?id=${l.product.id}" class="text-[15px] font-semibold hover:text-brand-700">${esc(l.product.name)}</a><p class="mt-0.5 text-[12.5px] text-gray-500">${esc(Store.variantLabel(l.product, l.variant))}</p><p class="mt-0.5 text-[11.5px] text-gray-400">${l.variant.stock <= 2 ? `Only ${l.variant.stock} left` : 'In stock'}</p></div><p class="text-[15px] font-bold">${money(l.variant.price * l.qty)}</p></div>
    <div class="mt-3 flex items-center justify-between"><div class="inline-flex items-center rounded-lg border border-gray-200"><button data-dec="${l.key}" ${l.qty <= 1 ? 'disabled' : ''} class="grid h-8 w-8 place-items-center hover:bg-gray-50 disabled:opacity-30" aria-label="Decrease">−</button><span class="w-8 text-center text-[13px] font-semibold">${l.qty}</span><button data-inc="${l.key}" ${l.qty >= l.variant.stock ? 'disabled' : ''} class="grid h-8 w-8 place-items-center hover:bg-gray-50 disabled:opacity-30" aria-label="Increase">+</button></div>
    <button data-rm="${l.key}" class="text-[12.5px] font-semibold text-gray-500 hover:text-rose-600">Remove</button></div></div></li>`).join('')}</ul>
  <a href="shop.html" class="mt-4 inline-block text-sm font-semibold text-brand-700 hover:underline">← Continue shopping</a></div>
  <aside class="h-fit rounded-2xl border border-gray-200 bg-white p-5 lg:sticky lg:top-28"><h2 class="font-display text-lg font-extrabold">Order summary</h2>
    <form id="promo" class="mt-4 flex gap-2"><label class="sr-only" for="code">Promo code</label><input id="code" placeholder="Promo code" value="${Store.state.promo || ''}" class="min-w-0 flex-1 w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/15 py-2.5"/><button class="rounded-xl border border-gray-300 px-4 text-sm font-semibold hover:bg-gray-50">Apply</button></form>
    <p class="mt-1.5 text-[11.5px] text-gray-400">Try <b>WELCOME10</b> or <b>KNIT15</b>.</p>
    <dl class="mt-4 space-y-2 text-[13.5px]"><div class="flex justify-between text-gray-600"><dt>Subtotal</dt><dd class="font-medium text-gray-900">${money(sub)}</dd></div>
    ${disc ? `<div class="flex justify-between text-brand-700"><dt>${Store.state.promo} <button id="rm-promo" class="ml-1 text-[11px] underline">remove</button></dt><dd>−${money(disc)}</dd></div>` : ''}
    <div class="flex justify-between text-gray-600"><dt>Shipping</dt><dd class="font-medium text-gray-900">${ship ? money(ship) : 'Free'}</dd></div>
    <div class="flex justify-between border-t border-gray-200 pt-3 text-base font-bold"><dt>Total</dt><dd>${money(Store.cart.total())}</dd></div></dl>
    <a href="checkout.html" class="mt-5 block rounded-xl bg-brand-700 py-3.5 text-center text-sm font-semibold text-white hover:bg-brand-800">Proceed to checkout</a></aside></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !$('cart-root').contains(b)) return;
  const l = k => Store.cart.lines().find(x => x.key === k);
  if (b.dataset.rm) Store.cart.remove(b.dataset.rm);
  if (b.dataset.inc) Store.cart.setQty(b.dataset.inc, l(b.dataset.inc).qty + 1);
  if (b.dataset.dec) Store.cart.setQty(b.dataset.dec, l(b.dataset.dec).qty - 1);
  if (b.id === 'rm-promo') Store.cart.removePromo();
});
document.addEventListener('submit', e => { if (e.target.id === 'promo') { e.preventDefault(); const c = $('code').value; if (!c.trim()) return; Store.cart.applyPromo(c) ? Store.toast('Promo code applied') : Store.toast('That code is not valid'); } });
document.addEventListener('store:change', render); render();

</script>
</body>
</html>
