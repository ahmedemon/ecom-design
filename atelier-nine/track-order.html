<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Track order — Atelier Nine</title>
<meta name="description" content="Atelier Nine makes considered footwear, knitwear and everyday clothing in small runs, from materials that age well." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="font-sans text-gray-900 antialiased" data-page="track">
<div id="site-header"></div>
<main id="top" class="">
<section class="bg-sand"><div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 sm:py-16 lg:px-8"><nav class="text-[12px] text-gray-500" aria-label="Breadcrumb"><a class="hover:text-gray-900" href="index.html">Home</a> <span class="mx-1 text-gray-300">/</span> <span class="text-gray-800">Track order</span></nav>
<p class="mt-4 text-[11px] font-semibold uppercase tracking-wider text-brand-700">Support</p>
<h1 class="mt-2 max-w-3xl font-display text-3xl font-extrabold leading-tight tracking-tight text-gray-900 sm:text-4xl">Track your order</h1>
<p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-gray-600">Enter your order number and email. Orders placed in this demo are stored in your browser, so tracking works on the device you used.</p></div></section>
<div class="mx-auto max-w-2xl px-4 py-10 sm:px-6">
<form id="tf" class="grid gap-4 rounded-2xl border border-gray-200 bg-white p-6 sm:grid-cols-2"><div><label class="block text-[12px] font-semibold text-gray-700" for="oid">Order number</label><input id="oid" required placeholder="AN-123456" class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/15"/></div><div><label class="block text-[12px] font-semibold text-gray-700" for="oem">Email</label><input id="oem" type="email" required placeholder="you@email.com" class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/15"/></div><button class="rounded-xl bg-brand-700 px-6 py-3 text-sm font-semibold text-white transition hover:bg-brand-800 disabled:cursor-not-allowed disabled:opacity-40 sm:col-span-2">Track order</button></form>
<div id="tr" class="mt-8"></div></div>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>

const { money, esc } = Store, $ = id => document.getElementById(id);
const STEPS = [['Order placed', 0], ['Packed at our Portland studio', 4], ['Handed to carrier', 20], ['Out for delivery', 72], ['Delivered', 96]];
function show(id, email) {
  const o = Store.orders.get(id);
  if (!o || o.email.toLowerCase() !== email.trim().toLowerCase()) { $('tr').innerHTML = `<div class="rounded-2xl bg-rose-50 p-5 text-sm text-rose-800">We couldn't find an order matching those details on this device. Check the order number and email, or <a class="font-semibold underline" href="contact.html">contact us</a>.</div>`; return; }
  const hrs = (Date.now() - new Date(o.createdAt)) / 36e5; // demo: accelerate time (1 real minute = 4 hours)
  const sim = hrs * 60 * 4 / 60 * 1;
  const done = STEPS.filter(s => (hrs * 240) >= s[1] * 60 / 60 * 1 && true).length;
  const cur = Math.min(STEPS.length, Math.max(1, STEPS.filter(s => hrs * 240 >= s[1]).length));
  $('tr').innerHTML = `<div class="rounded-2xl border border-gray-200 bg-white p-6"><div class="flex flex-wrap items-center justify-between gap-2"><div><p class="text-[11px] font-semibold uppercase tracking-wider text-gray-400">Order</p><p class="font-display text-xl font-extrabold">${o.id}</p></div><span class="rounded-full bg-brand-50 px-3 py-1 text-[12px] font-semibold text-brand-800">${STEPS[cur - 1][0]}</span></div>
  <ol class="mt-6 space-y-5">${STEPS.map((s, i) => `<li class="flex gap-3"><span class="mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-full text-[11px] font-bold ${i < cur ? 'bg-brand-700 text-white' : 'bg-gray-100 text-gray-400'}">${i < cur ? '✓' : i + 1}</span><div><p class="text-sm font-semibold ${i < cur ? 'text-gray-900' : 'text-gray-400'}">${s[0]}</p>${i === 0 ? `<p class="text-[12px] text-gray-500">${new Date(o.createdAt).toLocaleString()}</p>` : ''}</div></li>`).join('')}</ol>
  <p class="mt-6 border-t border-gray-100 pt-4 text-[12px] text-gray-400">Demo tracking: progress is simulated from the time you placed the order.</p></div>
  <div class="mt-4 rounded-2xl bg-gray-50 p-5 text-[13.5px] text-gray-600"><p class="font-semibold text-gray-900">${o.items.length} item${o.items.length > 1 ? 's' : ''} · ${money(o.total)}</p><p class="mt-1">${o.items.map(i => esc(i.name) + ' × ' + i.qty).join(', ')}</p><p class="mt-2">Shipping to ${esc(o.address)}</p></div>`;
}
$('tf').onsubmit = e => { e.preventDefault(); show($('oid').value, $('oem').value); };
const p = new URLSearchParams(location.search); if (p.get('id')) { $('oid').value = p.get('id'); $('oem').value = p.get('email') || ''; if (p.get('email')) show(p.get('id'), p.get('email')); }

</script>
</body>
</html>
